name: solace
version: 18.2.1+6302
publish_to: none
description: Solace - AI 陪伴应用，多角色聊天、心情日记、从回忆创建角色。纯本地存储，隐私安全。

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  http: ^1.1.0
  uuid: ^4.2.1
  intl: ^0.18.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.2
  json_annotation: ^4.8.1
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  image: ^4.0.17
  url_launcher: ^6.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  workmanager: ^0.9.0
  open_file: ^3.3.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  web_socket_channel: ^3.0.3

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  flutter_remix: ^0.0.3
  hive_flutter: ^1.1.0
  yaml: ^3.1.2
  webview_flutter: ^4.10.0

  # 本地离线语音（TTS 走 MiMo 云端 API；STT/VAD 用 sherpa-onnx 本地模型）
  # STT/VAD 模型文件不内置，用户手动导入（见 VoiceModelManager）
  sherpa_onnx: 1.13.3
  archive: ^3.6.1
  audioplayers: ^6.8.1
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  bloc_test: ^9.1.0
  sqflite_common_ffi: ^2.3.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/default_pack/
    - assets/stickers/default_pack/metadata.json
    
    - assets/avatar_author.png
    - assets/graph/index.html
    - assets/graph/d3.min.js
    - assets/phone_icons/
    - assets/phone_icons/generated/
    - assets/voice/
  fonts:
    - family: TwitterIcon
      fonts:
        - asset: assets/fonts/twitter_icons.ttf

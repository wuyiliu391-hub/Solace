# JDK 路径不要写死在这里：本地靠 JAVA_HOME，CI 靠 actions/setup-java。
# 曾经写死一个 Windows 的 JDK 绝对路径，导致 Linux runner 上 Gradle 直接起不来。
# 如确需覆盖，用 -Dorg.gradle.java.home=... 或 ORG_GRADLE_PROJECT_org.gradle.java.home

# 性能（2C4T + 8GB）
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.enableR8=true
android.newDsl=false

# 减少日志输出
org.gradle.logging.level=warn
android.debug.obsoleteApi=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

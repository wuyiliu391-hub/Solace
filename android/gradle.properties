# 指定JDK路径（绕过环境变量问题）
org.gradle.java.home=E:\\jdk-17.0.20.1+1

# 性能（2C4T + 8GB）
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.enableR8=true
android.newDsl=false

# 减少日志输出
org.gradle.logging.level=warn
android.debug.obsoleteApi=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
